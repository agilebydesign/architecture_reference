<link rel="stylesheet" href="{{contextFolderCssUri}}">
<section class="context-folder-section">
  <label>Folder Path:
    <input id="folderPath" type="text" value="{{folderPath}}" placeholder="Path to context folder" />
  </label>
  <button id="browseBtn">Browse</button>
  <div class="bot-info">
    <span class="label">Bot:</span>
    <span id="botName">{{botName}}</span>
    <span class="label">Directory:</span>
    <span id="botDirectory">{{botDirectory}}</span>
  </div>
</section>
